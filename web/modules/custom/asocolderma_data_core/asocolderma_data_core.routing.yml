asocolderma_data_core.gestion_data:
  path: '/admin/asocolderma/data-core'
  defaults:
    _controller: '\Drupal\asocolderma_data_core\Controller\DataCoreAdminController::overview'
    _title: 'Gestión de la data'
  requirements:
    _permission: 'administer asocolderma data core+view asocolderma data core+audit asocolderma data core'

asocolderma_data_core.importacion:
  path: '/gestion-data/importacion'
  defaults:
    _form: '\Drupal\asocolderma_data_core\Form\DataImportForm'
    _title: 'Importación de data'
  requirements:
    _permission: 'administer asocolderma data core'

asocolderma_data_core.export_patrocinadores_excel:
  path: '/admin/asocolderma/patrocinadores/export/excel'
  defaults:
    _controller: '\Drupal\asocolderma_data_core\Controller\PatrocinadoresExportController::exportExcel'
    _title: 'Exportar patrocinadores EXCEL'
  requirements:
    _permission: 'administer asocolderma data core+audit asocolderma data core'

asocolderma_data_core.bulk_status:
  path: '/admin/asocolderma/data-core/bulk-status'
  defaults:
    _controller: '\Drupal\asocolderma_data_core\Controller\DataBulkActionController::bulkStatus'
  methods: [POST]
  requirements:
    _permission: 'administer asocolderma data core'

asocolderma_data_core.bulk_delete:
  path: '/admin/asocolderma/data-core/bulk-delete'
  defaults:
    _controller: '\Drupal\asocolderma_data_core\Controller\DataBulkActionController::bulkDelete'
  methods: [POST]
  requirements:
    _permission: 'administer asocolderma data core'

asocolderma_data_core.proveedores_export_excel:
  path: '/admin/asocolderma/proveedores/export/excel'
  defaults:
    _controller: '\Drupal\asocolderma_data_core\Controller\ProveedoresExportController::exportExcel'
    _title: 'Exportar proveedores EXCEL'
  requirements:
    _permission: 'administer asocolderma data core+audit asocolderma data core'

asocolderma_data_core.asociados_export_excel:
  path: '/admin/asocolderma/asociados/export/excel'
  defaults:
    _controller: '\Drupal\asocolderma_data_core\Controller\AsociadosExportController::exportExcel'
    _title: 'Exportar asociados EXCEL'
  requirements:
    _permission: 'administer asocolderma data core+audit asocolderma data core'

asocolderma_data_core.residentes_export_excel:
  path: '/admin/asocolderma/residentes/export/excel'
  defaults:
    _controller: '\Drupal\asocolderma_data_core\Controller\ResidentesExportController::exportExcel'
    _title: 'Exportar residentes EXCEL'
  requirements:
    _permission: 'administer asocolderma data core+audit asocolderma data core'

asocolderma_data_core.empleados_export_excel:
  path: '/admin/asocolderma/empleados/export/excel'
  defaults:
    _controller: '\Drupal\asocolderma_data_core\Controller\EmpleadosExportController::exportExcel'
    _title: 'Exportar empleados EXCEL'
  requirements:
    _permission: 'administer asocolderma data core+audit asocolderma data core'

asocolderma_data_core.import_template_download:
  path: '/gestion-data/importacion/plantilla/{table}'
  defaults:
    _controller: '\Drupal\asocolderma_data_core\Controller\ImportTemplateController::download'
    _title: 'Descargar plantilla de importación'
  requirements:
    _permission: 'administer asocolderma data core'
    table: 'patrocinadores|proveedores|asociados|residentes|empleados'

asocolderma_data_core.proveedores_create:
  path: '/gestion-data/proveedores/crear'
  defaults:
    _form: '\Drupal\asocolderma_data_core\Form\ProveedorRecordForm'
    _title: 'Crear proveedor'
  requirements:
    _permission: 'administer asocolderma data core'

asocolderma_data_core.proveedores_edit:
  path: '/gestion-data/proveedores/{record_id}/editar'
  defaults:
    _form: '\Drupal\asocolderma_data_core\Form\ProveedorRecordForm'
    _title: 'Editar proveedor'
  requirements:
    _permission: 'administer asocolderma data core'
    record_id: '\d+'

