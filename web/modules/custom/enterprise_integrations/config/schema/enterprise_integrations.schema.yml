enterprise_integrations.settings:
  type: config_object
  label: 'Enterprise Integrations settings'
  mapping:
    mandrill:
      type: mapping
      label: 'Mandrill settings'
      mapping:
        api_key:
          type: string
          label: 'API key'
        message_groups_last_id:
          type: integer
          label: 'Last message group ID'
        message_groups:
          type: sequence
          label: 'Message groups'
          sequence:
            type: mapping
            label: 'Message group'
            mapping:
              key:
                type: string
                label: 'Key'
              mandrill_template_slug:
                type: string
                label: 'Mandrill template slug'
              send_copy:
                type: boolean
                label: 'Send copy'
              copy_template_slug:
                type: string
                label: 'Copy template slug'
              copy_emails:
                type: sequence
                label: 'Copy emails'
                sequence:
                  type: string
                  label: 'Copy email'