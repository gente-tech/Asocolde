enterprise_integrations.settings:
  type: config_object
  label: 'Enterprise Integrations settings'
  mapping:
    mandrill:
      type: mapping
      label: 'Mandrill settings'
      mapping:
        api_key:
          type: string
          label: 'API key'
        from_email:
          type: string
          label: 'From email'
        from_name:
          type: string
          label: 'From name'
        default_subject:
          type: string
          label: 'Default subject'
        default_html_template:
          type: text
          label: 'Default HTML template'
        internal_copy_enabled:
          type: boolean
          label: 'Internal copy enabled'
        internal_copy_email:
          type: string
          label: 'Internal copy email'
        internal_copy_name:
          type: string
          label: 'Internal copy name'
        message_groups_last_id:
          type: integer
          label: 'Last message group ID'
        message_groups:
          type: sequence
          label: 'Message groups'
          sequence:
            type: mapping
            label: 'Message group'
            mapping:
              key:
                type: string
                label: 'Key'
              subject:
                type: string
                label: 'Subject'
              message:
                type: text
                label: 'Message'