enterprise_integrations.asocolderma:
  path: '/admin/config/asocolderma'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Asocolderma'
  requirements:
    _permission: 'administer site configuration'

enterprise_integrations.integraciones:
  path: '/admin/config/asocolderma/integraciones'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Integraciones'
  requirements:
    _permission: 'administer site configuration'

enterprise_integrations.zohosign_settings:
  path: '/admin/config/asocolderma/integraciones/sign-doc'
  defaults:
    _form: '\Drupal\enterprise_integrations\Form\ZohoSignSettingsForm'
    _title: 'SignDoc'
  requirements:
    _permission: 'administer site configuration'

enterprise_integrations.mailchimp_settings:
  path: '/admin/config/asocolderma/integraciones/mandrill'
  defaults:
    _form: '\Drupal\enterprise_integrations\Form\MandrillSettingsForm'
    _title: 'Mandrill Settings'
  requirements:
    _permission: 'administer site configuration'

enterprise_integrations.hubspot_settings:
  path: '/admin/config/asocolderma/integraciones/hubspot'
  defaults:
    _form: '\Drupal\enterprise_integrations\Form\HubspotSettingsForm'
    _title: 'HubSpot Settings'
  requirements:
    _permission: 'administer site configuration'

enterprise_integrations.zoho_sign_test:
  path: '/admin/config/asocolderma/integraciones/sign-doc/test'
  defaults:
    _controller: '\Drupal\enterprise_integrations\Controller\ZohoSignTestController::testTemplate'
    _title: 'Test Zoho Sign'
  requirements:
    _permission: 'administer site configuration'

enterprise_integrations.zoho_sign_create_test:
  path: '/admin/config/asocolderma/integraciones/sign-doc/create-test'
  defaults:
    _controller: '\Drupal\enterprise_integrations\Controller\ZohoSignCreateTestController::createDocument'
    _title: 'Create Test Zoho Sign'
  requirements:
    _permission: 'administer site configuration'

enterprise_integrations.zoho_sign_sign_url_test:
  path: '/admin/config/asocolderma/integraciones/sign-doc/sign-url-test'
  defaults:
    _controller: '\Drupal\enterprise_integrations\Controller\ZohoSignSignUrlTestController::getSignUrl'
    _title: 'Sign URL Test Zoho Sign'
  requirements:
    _permission: 'administer site configuration'

enterprise_integrations.zoho_sign_request_status_test:
  path: '/admin/config/asocolderma/integraciones/sign-doc/request-status-test'
  defaults:
    _controller: '\Drupal\enterprise_integrations\Controller\ZohoSignRequestStatusTestController::getRequestStatus'
    _title: 'Request Status Test Zoho Sign'
  requirements:
    _permission: 'administer site configuration'

enterprise_integrations.twilio:
  path: '/admin/config/asocolderma/integraciones/twilio'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Twilio'
  requirements:
    _permission: 'administer site configuration'

enterprise_integrations.twilio_templates_settings:
  path: '/admin/config/asocolderma/integraciones/twilio/templates'
  defaults:
    _form: '\Drupal\enterprise_integrations\Form\TwilioTemplatesSettingsForm'
    _title: 'Twilio Templates'
  requirements:
    _permission: 'administer site configuration'

enterprise_integrations.twilio_test_template:
  path: '/admin/config/asocolderma/integraciones/twilio/test-template'
  defaults:
    _controller: '\Drupal\enterprise_integrations\Controller\tests\TwilioTestController::sendTemplateTest'
    _title: 'Test Twilio Template'
  requirements:
    _permission: 'administer site configuration'