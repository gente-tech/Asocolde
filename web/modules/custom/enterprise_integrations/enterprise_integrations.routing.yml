enterprise_integrations.asocolderma:
  path: '/admin/config/asocolderma'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Asocolderma'
  requirements:
    _permission: 'administer site configuration'

enterprise_integrations.integraciones:
  path: '/admin/config/asocolderma/integraciones'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Integraciones'
  requirements:
    _permission: 'administer site configuration'

enterprise_integrations.zohosign_settings:
  path: '/admin/config/asocolderma/integraciones/sign-doc'
  defaults:
    _form: '\Drupal\enterprise_integrations\Form\ZohoSignSettingsForm'
    _title: 'SignDoc'
  requirements:
    _permission: 'administer site configuration'

enterprise_integrations.mailchimp_settings:
  path: '/admin/config/asocolderma/integraciones/mandrill'
  defaults:
    _form: '\Drupal\enterprise_integrations\Form\MandrillSettingsForm'
    _title: 'Mandrill Settings'
  requirements:
    _permission: 'administer site configuration'

enterprise_integrations.hubspot_settings:
  path: '/admin/config/asocolderma/integraciones/hubspot'
  defaults:
    _form: '\Drupal\enterprise_integrations\Form\HubspotSettingsForm'
    _title: 'HubSpot Settings'
  requirements:
    _permission: 'administer site configuration'