custom_login_2fa.settings:
  type: config_object
  label: 'Custom Login 2FA settings'
  mapping:
    enabled:
      type: boolean
      label: 'Enabled'
    protected_roles:
      type: sequence
      label: 'Protected roles'
      sequence:
        type: string
        label: 'Role ID'
    code_ttl:
      type: integer
      label: 'Code TTL in seconds'
    code_length:
      type: integer
      label: 'Code length'
    max_attempts:
      type: integer
      label: 'Maximum attempts'
    mandrill_message_key:
      type: string
      label: 'Mandrill message group key'
    default_redirect_path:
      type: string
      label: 'Default redirect path after successful 2FA'
    role_redirect_paths:
      type: mapping
      label: 'Role redirect paths'
      mapping:
        '*':
          type: string
          label: 'Redirect path'
    resend_cooldown:
      type: integer
      label: 'Resend cooldown in seconds'
    max_resends:
      type: integer
      label: 'Maximum resend attempts'